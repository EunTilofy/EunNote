map $http_upgrade $eunnote_connection { default upgrade; '' close; }
limit_conn_zone $binary_remote_addr zone=eunnote_connections:10m;
limit_req_zone $binary_remote_addr zone=eunnote_login:10m rate=10r/m;
log_format eunnote_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_ADDRESS;
    server_tokens off;
    access_log /var/log/nginx/eunnote-access.log eunnote_safe;
    if ($host != "SERVER_ADDRESS") { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/eunnote-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://SERVER_ADDRESS$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name SERVER_ADDRESS;
    server_tokens off;
    if ($host != "SERVER_ADDRESS") { return 444; }
    ssl_certificate /etc/letsencrypt/live/SERVER_ADDRESS/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_ADDRESS/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EUNNOTE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    limit_conn eunnote_connections 32;
    limit_conn_status 429;
    limit_req_status 429;
    access_log /var/log/nginx/eunnote-access.log eunnote_safe;

    location = /eunnote/auth/session {
        limit_req zone=eunnote_login burst=10 nodelay;
        client_max_body_size 4k;
        include /etc/nginx/eunnote-proxy.conf;
    }
    location = / { return 308 /eunnote/$is_args$args; }
    location = /eunnote { return 308 /eunnote/$is_args$args; }
    location ~ ^/(notion|clipboard|shuji|auth)(/.*)?$ { return 308 /eunnote$uri$is_args$args; }
    location ^~ /eunnote/ {
        include /etc/nginx/eunnote-proxy.conf;
    }
    location / { return 404; }
}
