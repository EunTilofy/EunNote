<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <title>功能页</title>
  <link rel="stylesheet" href="/home.css">
  <script src="/home.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">OUR LITTLE TOOLBOX</p>
      <h1>功能页<span>.</span></h1>
      <p class="subtitle">常用的小工具，都放在这里。</p>
    </header>
    <section class="tools" aria-label="工具列表">
      <a id="clipboardLink" class="tool clipboard" href="/clipboard/">
        <span class="icon" aria-hidden="true">⌘</span>
        <span class="number">01</span>
        <div><h2>剪贴板</h2><p>跨设备粘贴和复制文字，内容自动同步。</p></div>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a id="noteLink" class="tool note" href="/notion/">
        <span class="icon" aria-hidden="true">✎</span>
        <span class="number">02</span>
        <div><h2>note</h2><p>双人记事、待办、进行中事项与贴贴墙。</p></div>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a id="shujiLink" class="tool traces" href="/shuji/">
        <span class="icon" aria-hidden="true">⌁</span>
        <span class="number">03</span>
        <div><h2>数迹</h2><p>打开数迹，在数据里留下和发现线索。</p></div>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
  </main>
  <footer><span>3 个功能</span><span id="clock"></span></footer>
</body>
</html>
